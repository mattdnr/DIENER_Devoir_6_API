<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Catways</title>
</head>
<body>
  <header>
    <h1>Gestion des Catways</h1>
    <a href="/dashboard.html">Retour au tableau de bord</a>
  </header>
  
  <h2>Créer un Catway</h2>
  <form id="catwayForm">
    <input type="number" id="number" placeholder="Numéro" required>
    <select id="type">
      <option value="long">Long</option>
      <option value="short">Short</option>
    </select>
    <input type="text" id="state" placeholder="État" required>
    <button type="submit">Créer</button>
  </form>

  <h2>Liste des Catways</h2>
  <button onclick="loadCatways()">Actualiser</button>
  <ul id="catwaysList"></ul>

  <script src="js/catways.js"></script>
</body>
</html>
