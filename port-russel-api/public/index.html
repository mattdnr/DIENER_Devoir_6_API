<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Port Russel</title>
</head>
<body>

    <header>
        <h1>Port de plaisance Russel</h1>
    </header>
    <p>
        Cette application permet à la capitainerie du port Russell
        de gérer les catways, les réservations ainsi que les utilisateurs.
    </p>


    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Mot de passe" required><br><br>
        <button type="submit">Se connecter</button>
    </form>

    <p id="error" style="color: red;"></p>

    <footer>
        <a href="/api-docs">Documentation API</a>
    </footer>
        
    <script src="js/auth.js"></script>
</body>
</html>
