<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Réservations</title>
</head>
<body>
    <header>
        <h1>Gestion des Réservations</h1>
        <a href="/dashboard.html">Retour au tableau de bord</a>
    </header>

    <h2>Créer une réservation</h2>

    <form id="reservationForm">
        <input type="number"
            id="catwayNumber"
            placeholder="Numéro Catway"
            required>
        <input type="text"
            id="clientName"
            placeholder="Nom client"
            required>
        <input type="text"
            id="boatName"
            placeholder="Nom bateau"
            required>
        <input type="date"
            id="startDate"
            required>
        <input type="date"
            id="endDate"
            required>
        <button type="submit">Créer</button>
    </form>

  <h2>Liste des réservations</h2>
  <button onclick="loadReservations()">Actualiser</button>
  <ul id="reservationsList"></ul>

<script src="js/reservations.js"></script>
</body>
</html>
